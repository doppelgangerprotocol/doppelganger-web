<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}The Doppelgänger Protocol{% endblock %}</title>
    <meta name="description" content="Human-layer authentication using shared memory as a cryptographic trust anchor. No passwords. No biometrics. No AI can fake it.">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <header>
        <a href="/verify" class="wordmark">The Doppelgänger Protocol</a>
        <a href="https://realxreal.app" class="protocol-tag" target="_blank">
            Mobile app: realxreal ↗
        </a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <span>End-to-end encrypted · No accounts · Sessions expire in 5 min</span>
        <a href="https://github.com/doppelgangerprotocol/web" target="_blank">Open source ↗</a>
    </footer>

    <!--
        debug.js loads last so ProtocolLog is available to all other scripts.
        It injects its own HTML and CSS — no changes needed to templates.
        Remove this line to disable the debug panel in any environment.
    -->
    {% block scripts %}{% endblock %}
    <script src="/static/js/debug.js?v=2"></script>
</body>
</html>
